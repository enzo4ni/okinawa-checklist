<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沖繩旅行｜打包清單</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#163044;background:#f1f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 16px 70px}.hero{background:linear-gradient(125deg,#007f9b,#37b9b3);color:white;border-radius:24px;padding:28px;box-shadow:0 12px 28px #006a8129}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.sub{opacity:.95}.stats{display:flex;justify-content:space-between;margin:22px 0 8px;font-weight:700}.track{height:12px;background:#ffffff55;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#ffe49b;transition:width .25s}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.toolbar button,.add button{border:0;border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:700;background:#fff;color:#14637b}.toolbar button.active{background:#145f74;color:white}.section{background:white;border:1px solid #dce9eb;border-radius:18px;margin:15px 0;overflow:hidden;box-shadow:0 3px 10px #194a5310}.section h2{font-size:18px;margin:0;padding:16px 18px;background:#e8f6f6;display:flex;justify-content:space-between}.item{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid #eef3f4}.item input{width:21px;height:21px;accent-color:#008b87;flex-shrink:0}.item label{flex:1;cursor:pointer}.item.done label{text-decoration:line-through;color:#84949a}.delete{background:none;border:0;color:#9c5860;cursor:pointer;font-size:19px}.hint{font-size:13px;color:#617983}.add{display:flex;gap:8px;margin:20px 0}.add input,.add select{padding:12px;border:1px solid #bdd6d9;border-radius:11px;min-width:0}.add input{flex:1}.add button{background:#007e8b;color:white}.notice{background:#fff9e9;border-left:4px solid #efb94b;padding:14px;border-radius:10px;line-height:1.7}.empty{padding:15px;color:#6e858d}@media(max-width:600px){.add{flex-wrap:wrap}.add input{flex-basis:100%}.add select{flex:1}.add button{flex:0 0 auto}.hero{padding:22px}}</style></head><body><main class="wrap"><header class="hero"><div>🌴 OKINAWA TRIP · 2026</div><h1>沖繩行李打包清單 ✈️</h1><div class="sub">11/27（五）— 11/29（日）｜3 天 2 夜｜華航</div><div class="stats"><span id="count">0 / 0 已完成</span><span id="pct">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></header><div class="toolbar"><button class="active" data-filter="all">全部</button><button data-filter="todo">尚未準備</button><button data-filter="done">已準備</button><button id="reset">重設勾選</button></div><div class="notice">📌 出發前優先確認：護照、機票訂位、飯店資訊、eSIM、海外旅平險。行動電源請放隨身行李，不要託運；實際攜帶及機上使用規定以華航最新公告為準。</div><div id="sections"></div><form class="add" id="add"><input id="newItem" maxlength="80" placeholder="新增要帶的物品…" required><select id="category" aria-label="分類"></select><button type="submit">＋ 新增</button></form><p class="hint">🔒 清單自動儲存在目前瀏覽器中（localStorage），不會上傳網路。換手機、換瀏覽器或清除網站資料可能無法保留。可用下方按鈕匯出備份。</p><div class="toolbar"><button id="export">匯出清單備份</button><button id="import">匯入備份</button><input type="file" id="file" accept="application/json" hidden></div></main><script>
const defaults={"🛂 證件與重要資料":["護照（確認效期）","華航電子機票／訂位代號","飯店訂房確認資料（NAHANA HOTEL & SPA）","日幣現金","信用卡／金融卡","旅遊保險資料","護照與重要文件電子備份","Visit Japan Web 入境資料（選用）"],"📱 手機與 3C":["手機","日本 eSIM（確認開通時間）","手機充電線","充電器／USB-C 充電頭","行動電源（隨身攜帶）","耳機","相機／記憶卡／備用電池（如有）","相機充電器（如有）"],"👕 衣物與穿搭":["短袖上衣 × 3","薄外套／防風外套","長褲 × 2","內褲 × 3～4","襪子 × 3","睡衣","舒適好走的鞋","備用輕便鞋（選用）","雨傘／輕便雨衣"],"🧴 盥洗與健康":["牙刷／牙膏","洗面乳與保養品","防曬乳","衛生紙／濕紙巾","個人常備藥","口罩","隱形眼鏡／眼鏡（如需）","刮鬍刀","護唇膏"],"🎒 隨身與行程":["錢包／鑰匙","隨身小包","可折疊購物袋","空水壺","行李箱與行李吊牌","確認託運及手提行李額度","預訂活動憑證／卡丁車相關資料","確認日本駕駛資格文件（若需駕駛）","回程伴手禮預留空間"]};
const key='okinawa-checklist-2026-v1';let items;try{items=JSON.parse(localStorage.getItem(key));if(!Array.isArray(items))throw Error();}catch{items=Object.entries(defaults).flatMap(([cat,arr])=>arr.map((name,i)=>({id:crypto.randomUUID(),cat,name,done:false})));}let filter='all';const categories=Object.keys(defaults);const sec=document.getElementById('sections'),select=document.getElementById('category');categories.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;select.append(o)});function save(){localStorage.setItem(key,JSON.stringify(items))}function render(){sec.replaceChildren();let completed=items.filter(x=>x.done).length,percent=items.length?Math.round(completed/items.length*100):0;document.getElementById('count').textContent=`${completed} / ${items.length} 已完成`;document.getElementById('pct').textContent=percent+'%';document.getElementById('fill').style.width=percent+'%';for(const cat of [...new Set([...categories,...items.map(x=>x.cat)])]){let group=items.filter(x=>x.cat===cat),visible=group.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done));if(!visible.length)continue;let section=document.createElement('section');section.className='section';let h=document.createElement('h2');let title=document.createElement('span');title.textContent=cat;let counter=document.createElement('span');counter.textContent=`${group.filter(x=>x.done).length}/${group.length}`;h.append(title,counter);section.append(h);visible.forEach(x=>{let row=document.createElement('div');row.className='item'+(x.done?' done':'');let cb=document.createElement('input');cb.type='checkbox';cb.checked=x.done;cb.id=x.id;cb.addEventListener('change',()=>{x.done=cb.checked;save();render()});let label=document.createElement('label');label.htmlFor=x.id;label.textContent=x.name;let del=document.createElement('button');del.className='delete';del.title='刪除此項';del.textContent='×';del.onclick=()=>{items=items.filter(y=>y.id!==x.id);save();render()};row.append(cb,label,del);section.append(row)});sec.append(section)}if(!sec.children.length){let p=document.createElement('p');p.className='empty';p.textContent='這個篩選條件下沒有項目。';sec.append(p)}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('add').onsubmit=e=>{e.preventDefault();let inp=document.getElementById('newItem'),name=inp.value.trim();if(!name)return;items.push({id:crypto.randomUUID(),cat:select.value,name,done:false});inp.value='';filter='all';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));save();render()};document.getElementById('reset').onclick=()=>{if(confirm('確定要取消所有已勾選項目嗎？')){items.forEach(x=>x.done=false);save();render()}};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='沖繩打包清單備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(x=>typeof x.name==='string'&&typeof x.cat==='string'&&typeof x.done==='boolean'))throw Error();if(confirm('匯入會覆蓋目前清單，確定嗎？')){items=data.map(x=>({id:crypto.randomUUID(),cat:x.cat,name:x.name,done:x.done}));save();render()}}catch{alert('備份檔格式不正確')}e.target.value=''};save();render();</script></body></html>
